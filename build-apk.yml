name: Build APK

# Chạy thủ công: vào tab Actions -> "Build APK" -> Run workflow.
# Cũng tự chạy mỗi khi bạn đẩy code lên nhánh main.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cài thư viện Capacitor
        run: npm ci

      - name: Đưa bản web (thư mục www) vào dự án Android
        run: npx cap sync android

      - name: Build APK (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Lưu tệp APK
        uses: actions/upload-artifact@v4
        with:
          name: PinkVocab-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
